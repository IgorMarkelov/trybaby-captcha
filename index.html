<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Проверка TryBaby</title>

  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <script src="./config.js?v=20261023114401"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #000000;
      --button-bg: #007aff;
      --button-text: #ffffff;
      --error: #d92d20;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
    }

    .content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: var(--bg);
    }

    .stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-54px);
    }

    .robot {
      display: block;
      width: 80px;
      height: 80px;
      flex: 0 0 80px;
      object-fit: contain;
      margin-bottom: 48px;
      user-select: none;
      -webkit-user-drag: none;
    }

    .copy {
      width: 100%;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      text-align: center;
      word-break: break-word;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      width: 100%;
      font-size: 20px;
      line-height: 25px;
      font-weight: 600;
      letter-spacing: -0.43px;
    }

    .description {
      width: 100%;
      font-size: 17px;
      line-height: 22px;
      font-weight: 400;
      letter-spacing: -0.43px;
    }

    .action {
      width: 100%;
      height: 48px;
      min-height: 48px;
      border: 0;
      border-radius: 100px;
      padding: 0 16px;
      appearance: none;
      background: var(--button-bg);
      color: var(--button-text);
      font-family: inherit;
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
      letter-spacing: -0.43px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .action:active:not(:disabled) {
      transform: scale(0.99);
      opacity: 0.86;
    }

    .action:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .status {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 0 8px;
      text-align: center;
      font-size: 13px;
      line-height: 17px;
      color: var(--error);
    }

    .status.visible {
      display: block;
    }

    @media (max-width: 359px) {
      .content {
        padding: 0 12px;
      }

      .stack {
        transform: translateY(-44px);
      }

      .robot {
        width: 72px;
        height: 72px;
        flex-basis: 72px;
        margin-bottom: 40px;
      }

      .copy {
        padding: 0 4px;
        margin-bottom: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="content" aria-label="Проверка на человечность">
    <div class="stack">
      <img
        class="robot"
        src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Robot.png"
        alt=""
        aria-hidden="true"
      >

      <div class="copy">
        <h1>Проверка на человечность</h1>
        <p class="description">Нажмите на кнопку ниже, чтобы присоединиться к чату родителей</p>
      </div>

      <button class="action" id="confirm" type="button">Я не робот</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const API_BASE = window.TRYBABY_CONFIG?.API_BASE?.replace(/\/$/, "") || "";
    const button = document.getElementById("confirm");
    const status = document.getElementById("status");

    tg?.ready();
    tg?.setBackgroundColor?.("#ffffff");
    tg?.setHeaderColor?.("#ffffff");

    const unsafe = tg?.initDataUnsafe || {};

    function showError(message) {
      status.textContent = message;
      status.classList.add("visible");
    }

    function clearError() {
      status.textContent = "";
      status.classList.remove("visible");
    }

    if (!tg?.initData || !unsafe.chat_join_request_query_id) {
      button.disabled = true;
      showError("Откройте проверку из заявки на вступление в группу");
    } else if (!API_BASE || API_BASE.includes("REPLACE_ME")) {
      button.disabled = true;
      showError("Проверка временно недоступна. Попробуйте позже");
    }

    button.addEventListener("click", async () => {
      const originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = "Проверяем…";
      clearError();
      tg?.HapticFeedback?.impactOccurred?.("light");

      try {
        const response = await fetch(`${API_BASE}/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: tg.initData }),
          cache: "no-store"
        });

        let data = {};
        try {
          data = await response.json();
        } catch (_) {}

        if (!response.ok) {
          throw new Error(data.detail || `HTTP ${response.status}`);
        }

        tg?.HapticFeedback?.notificationOccurred?.("success");

        setTimeout(() => {
          tg?.close();
        }, 180);
      } catch (error) {
        tg?.HapticFeedback?.notificationOccurred?.("error");
        showError(`Ошибка: ${error.message}`);
        button.textContent = originalLabel;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
