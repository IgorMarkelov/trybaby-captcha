
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Проверка TryBaby</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: light;
      --tg-bg: #ffffff;
      --tg-text: #222222;
      --tg-hint: #858585;
      --tg-button: #3390ec;
      --tg-button-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(32px, env(safe-area-inset-top))
        24px
        max(28px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tg-bg);
      color: var(--tg-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    .captcha {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .robot {
      display: block;
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      max-width: 320px;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.45px;
    }

    .description {
      margin: 12px 0 28px;
      max-width: 310px;
      color: var(--tg-hint);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 400;
    }

    .verify-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      background: var(--tg-button);
      color: var(--tg-button-text);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .verify-button:active {
      opacity: 0.82;
      transform: scale(0.985);
    }

    .status {
      margin: 14px 0 0;
      color: var(--tg-hint);
      font-size: 13px;
      line-height: 1.4;
    }

    .status:empty {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .verify-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="captcha">
    <img
      class="robot"
      src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Robot.png"
      alt="Робот"
      width="88"
      height="88"
    >

    <h1>Короткая проверка на человечность</h1>

    <p class="description">
      Нажмите кнопку и начните общение в чате родителей
    </p>

    <button class="verify-button" id="verify" type="button">
      Я не робот
    </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const button = document.getElementById("verify");
    const status = document.getElementById("status");

    if (tg) {
      tg.ready();
      tg.setHeaderColor("#ffffff");
      tg.setBackgroundColor("#ffffff");

      const theme = tg.themeParams || {};

      if (theme.text_color) {
        document.documentElement.style.setProperty(
          "--tg-text", theme.text_color
        );
      }

      if (theme.hint_color) {
        document.documentElement.style.setProperty(
          "--tg-hint", theme.hint_color
        );
      }

      if (theme.button_color) {
        document.documentElement.style.setProperty(
          "--tg-button", theme.button_color
        );
      }

      if (theme.button_text_color) {
        document.documentElement.style.setProperty(
          "--tg-button-text", theme.button_text_color
        );
      }
    }

    button.addEventListener("click", () => {
      status.textContent =
        "Интерфейс готов. Подключение проверки будет на следующем этапе.";
    });
  </script>
</body>
</html>
