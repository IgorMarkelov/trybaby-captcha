<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка TryBaby</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;max-width:420px;margin:70px auto;padding:20px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#222)}button{background:#3488ed;color:white;border:0;border-radius:12px;padding:16px 26px;font-size:17px;cursor:pointer}button:disabled{opacity:.5}#result{margin-top:20px}</style></head>
<body><h2>Короткая проверка на человечность</h2><p>Нажмите кнопку и начните общение в чате родителей</p>
<button id="confirm">Я не робот</button><p id="result"></p>
<script>
// ВАЖНО: замените строку на адрес HTTPS-туннеля или постоянно размещённого API.
const API_BASE = "https://played-originally-valves-museum.trycloudflare.com";
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const diagnostic = document.createElement('pre');
diagnostic.style.cssText =
  'font-size:12px;text-align:left;white-space:pre-wrap;';

const params = new URLSearchParams(location.hash.slice(1));

diagnostic.textContent = [
  'Telegram SDK: ' + Boolean(window.Telegram?.WebApp),
  'initData: ' + Boolean(window.Telegram?.WebApp?.initData),
  'URL tgWebAppData: ' + Boolean(params.get('tgWebAppData')),
  'Platform: ' + (window.Telegram?.WebApp?.platform || 'unknown'),
  'Version: ' + (window.Telegram?.WebApp?.version || 'unknown')
].join('\n');

document.body.appendChild(diagnostic);

const button = document.getElementById('confirm');
const output = document.getElementById('result');
button.addEventListener('click', async () => {
  if (!tg?.initData) {output.textContent = 'Откройте приложение из Telegram через ссылку бота'; return;}
  button.disabled = true; output.textContent = 'Проверяем…';
  try {
    const r = await fetch(`${API_BASE}/verify`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({init_data:tg.initData})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Неизвестная ошибка');
    output.textContent = data.message;
    tg?.HapticFeedback?.notificationOccurred('success');
    // Не закрываем окно автоматически: человек должен успеть увидеть результат.
  } catch (e) {output.textContent = `Ошибка: ${e.message}`; button.disabled = false;}
});
</script></body></html>
