<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Проверка TryBaby</title>
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #0d0d0d;
      --page-accent: linear-gradient(90deg, #a6d96a 0%, #5fa06b 100%);
      --sheet-bg: #f3f3f3;
      --text-main: #111111;
      --text-muted: #4e4e4e;
      --button-bg: #3586ea;
      --button-text: #ffffff;
      --status-ok: #188038;
      --status-error: #d93025;
      --sheet-radius: 34px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding:
        max(16px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      overflow: hidden;
    }

    .app {
      width: min(100%, 430px);
      min-height: min(92svh, 860px);
      position: relative;
      border-radius: 44px;
      overflow: hidden;
      background: var(--page-bg);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
    }

    .top-strip {
      height: clamp(20px, 5vw, 28px);
      background: var(--page-accent);
    }

    .sheet {
      min-height: calc(100% - clamp(20px, 5vw, 28px));
      background: var(--sheet-bg);
      border-radius: 38px 38px 44px 44px;
      padding: clamp(28px, 7vw, 40px) clamp(22px, 6vw, 34px) clamp(32px, 8vw, 42px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
    }

    .emoji {
      width: clamp(64px, 18vw, 88px);
      height: clamp(64px, 18vw, 88px);
      object-fit: contain;
      margin-bottom: 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.04em;
      max-width: 11ch;
    }

    p.description {
      margin: 0;
      max-width: 18ch;
      font-size: clamp(19px, 5vw, 24px);
      line-height: 1.16;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }

    button#confirm {
      appearance: none;
      border: 0;
      border-radius: 18px;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: clamp(22px, 5.7vw, 28px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.03em;
      padding: clamp(18px, 4.8vw, 22px) clamp(24px, 9vw, 44px);
      min-width: min(100%, 288px);
      min-height: 74px;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease, filter .15s ease;
      box-shadow: 0 8px 18px rgba(53, 134, 234, 0.22);
      margin-top: 4px;
    }

    button#confirm:active { transform: translateY(1px) scale(.995); }
    button#confirm:disabled {
      cursor: default;
      opacity: .7;
      filter: saturate(.9);
      box-shadow: none;
    }

    #result {
      min-height: 24px;
      margin: 0;
      font-size: clamp(15px, 4.1vw, 18px);
      line-height: 1.3;
      color: var(--text-muted);
      max-width: 22ch;
    }

    #result.ok { color: var(--status-ok); }
    #result.error { color: var(--status-error); }

    @media (max-width: 390px) {
      body { padding-inline: 10px; }
      .app {
        width: 100%;
        min-height: min(88svh, 760px);
        border-radius: 34px;
      }
      .sheet {
        border-radius: 30px 30px 34px 34px;
        padding: 24px 18px 28px;
      }
      button#confirm {
        min-width: 100%;
        min-height: 68px;
      }
    }

    @media (min-width: 431px) {
      body { align-items: center; }
      .app { min-height: 760px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Проверка на человечность">
    <div class="top-strip"></div>
    <section class="sheet">
      <img
        class="emoji"
        src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Robot.png"
        alt="Robot"
      >
      <h1>Короткая проверка на человечность</h1>
      <p class="description">Нажмите кнопку и начните общение в чате родителей</p>
      <button id="confirm" type="button">Я не робот</button>
      <p id="result" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const API_BASE = window.TRYBABY_CONFIG?.API_BASE?.replace(/\/$/, "") || "";
    const button = document.getElementById("confirm");
    const output = document.getElementById("result");

    tg?.ready();
    tg?.setHeaderColor?.("#0d0d0d");
    tg?.setBackgroundColor?.("#0d0d0d");

    const unsafe = tg?.initDataUnsafe || {};

    function setMessage(text, kind = "") {
      output.textContent = text || "";
      output.className = kind;
    }

    if (!tg?.initData || !unsafe.chat_join_request_query_id) {
      button.disabled = true;
      setMessage("Откройте проверку из заявки на вступление, а не через профиль бота.", "error");
    } else if (!API_BASE || API_BASE.includes("REPLACE_ME")) {
      button.disabled = true;
      setMessage("Проверка временно недоступна. Попробуйте позже.", "error");
    }

    async function closeMiniAppSoon() {
      await new Promise(resolve => setTimeout(resolve, 350));
      try { tg?.close(); } catch (_) {}
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      setMessage("Проверяем…");
      tg?.HapticFeedback?.impactOccurred?.("light");

      try {
        const response = await fetch(`${API_BASE}/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: tg.initData }),
          cache: "no-store"
        });

        let data = {};
        try { data = await response.json(); } catch (_) {}
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);

        tg?.HapticFeedback?.notificationOccurred?.("success");
        setMessage(data.message || "Проверка пройдена.", "ok");
        await closeMiniAppSoon();
      } catch (error) {
        tg?.HapticFeedback?.notificationOccurred?.("error");
        setMessage(`Ошибка: ${error.message}`, "error");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
